name: RevenueOS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v --cov=backend/engine --cov-report=term-missing

      - name: Test Sample Data Generator
        run: |
          python data/generate_sample_data.py --rows 500 --customers 50 --out-dir data/sample

      - name: Test Core Engine Pipeline Execution
        run: |
          python backend/engine/core.py data/raw/excel/revenueos_sample.xlsx --output-dir exports/ci_test --no-visuals

  frontend-check:
    name: Frontend Syntax & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          node --check frontend/main.js
          node --check frontend/preload.js
          node --input-type=module --check < frontend/app.js
          for file in frontend/modules/*.js; do
            node --check "$file"
          done

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Verify Portable Model Manifest
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('frontend/model_data_sample.json', 'utf-8'));
            if (!data.status || data.status !== 'SUCCESS') process.exit(1);
            console.log('Sample model validated successfully:', data.projectName);
          "
